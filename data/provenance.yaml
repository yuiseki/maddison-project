checked:
  note: scripts/02_verify.py, before upload
  items:
    - every raw file against MANIFEST.json (size, sha256, SHA-1 stated by DataverseNL for 2023) and opened as its type
    - each sheet re-read with the Python standard library alone (zipfile, xml.etree); its row count equals the Parquet's and the pinned count
    - every value equals its cell, typed the same way, row by row in sheet order (sha256 over all values on both sides)
    - columns are the sheet's header, each of the type its name gives
    - key unique (countrycode and year; region and year; countrycode)
    - a DuckDB with no extension loaded opens every file
    - no bloom filters

modifications:
  raw: none. GGDC's xlsx, dta and pdf, byte for byte.
  parquet:
    - read from the xlsx with DuckDB's excel extension, every cell as text
    - typed by column name (year INTEGER; gdppc, cgdppc, rgdpnapc, pop DOUBLE; the rest text); a value that does not fit stops the build
    - rows with no value in any column left out (126 at the foot of the 2018 Full data sheet)
    - empty strings in the 2018 i_cig and i_bm kept as empty strings
    - sheet order kept; zstd; no bloom filters
